[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchvcr"
version = "0.1.0"
description = "Record, strictly replay, and fault-inject synchronous text instrument protocols"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BenchVCR contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
pyvisa = ["PyVISA>=1.14"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
benchvcr = "benchvcr.cli:main"

[project.entry-points.pytest11]
benchvcr = "benchvcr.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/benchvcr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["src/benchvcr"]
omit = ["*/benchvcr/pytest_plugin.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
  ".cache",
  ".python",
  ".tools",
  ".venv",
  ".wheel-venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Nested with blocks make exception/context-exit boundaries explicit in tests.
"tests/**/*.py" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.uv]
cache-dir = ".cache/uv"
python-install-dir = ".python"
